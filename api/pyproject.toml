[project]
name = "fitment-api"
version = "0.1.0"
description = "Fitment-aware parts lookup API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitment"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
